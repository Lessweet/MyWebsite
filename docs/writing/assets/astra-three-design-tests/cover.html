function roundPoly(points,r,sharp){

    return{bef:[B[0]-uIx*rE,B[1]-uIy*rE],c1:[B[0]-uIx*rE*(1-K),B[1]-uIy*rE*(1-K)],c2:[B[0]+uOx*rE*(1-K),B[1]+uOy*rE*(1-K)],aft:[B[0]+uOx*rE,B[1]+uOy*rE]};
  });
  var d='M '+f(V[0].aft[0])+' '+f(V[0].aft[1])+' ';

  return d+'Z';
}

  var FRAG='#version 300 es\nprecision highp float;\nout vec4 fragColor;\nuniform vec2 u_res;\nuniform float u_time;\nuniform vec3 u_c1,u_c2,u_c3,u_c4,u_c5;\nuniform float u_band,u_start,u_arc,u_wave,u_grain,u_sweep,u_mode;\nfloat hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}\nfloat noise(vec2 p){vec2 i=floor(p),f=fract(p);float a=hash(i),b=hash(i+vec2(1.,0.)),c=hash(i+vec2(0.,1.)),d=hash(i+vec2(1.,1.));vec2 u=f*f*(3.-2.*f);return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}\nfloat fbm(vec2 p){float v=0.,a=0.6;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<3;i++){v+=a*noise(p);p=m*p;a*=0.5;}return v;}\nvec3 filmGrain(vec3 col,float amt,float t){if(amt<0.001)return col;vec2 gp=floor(gl_FragCoord.xy/1.7);float tt=mod(floor(t*24.0),72.0);float n=fract(sin(dot(gp+tt*13.7,vec2(12.9898,78.233)))*43758.5453)-0.5;float lum=dot(col,vec3(0.299,0.587,0.114));float mid=1.0-abs(lum*2.0-1.0);return col+n*amt*0.22*(0.6+0.4*mid);}\nvoid main(){vec2 uv=gl_FragCoord.xy/u_res;float dxp=(uv.x-0.5)*u_res.x/u_res.y;float axis,perp;if(u_mode<0.5){axis=uv.y;perp=uv.x;}else if(u_mode<1.5){axis=uv.x;perp=uv.y;}else{axis=uv.y+u_arc*dxp*dxp;perp=uv.x;}vec3 col=mix(u_c2,u_c1,pow(clamp((axis-0.04)/0.38,0.0,1.0),1.3));float period=1.0+3.0*u_band;float wob=(fbm(vec2(perp*2.2,u_time*0.15))-0.5)*u_wave;float s=(axis+wob)/period+u_sweep+0.5-u_start/period;float d=abs(fract(s)-0.5)*period/max(0.04,u_band);vec3 warm=mix(u_c3,u_c4,smoothstep(0.0,0.5,d));warm=mix(warm,u_c5,smoothstep(0.45,1.0,d));col=mix(col,warm,1.0-smoothstep(1.05,1.5,d));col=filmGrain(col,u_grain,u_time);fragColor=vec4(clamp(col,0.0,1.0),1.0);}';
  function compile(t,s){var sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(sh));}return sh;}

  var aPos=gl.getAttribLocation(prog,'a_pos');gl.enableVertexAttribArray(aPos);gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);

  ['u_c1','u_c2','u_c3','u_c4','u_c5'].forEach(function(nm,i){var c=hx(COLORS[i]||COLORS[COLORS.length-1]);gl.uniform3f(U(nm),c[0],c[1],c[2]);});
  gl.uniform1f(U('u_band'),BAND);gl.uniform1f(U('u_start'),START);gl.uniform1f(U('u_arc'),ARC);

  function draw(t,sweep){
    var r=cv.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
    var w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));
    if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}

    new ResizeObserver(function(){draw(st,sweepAt(st));}).observe(cv);
    requestAnimationFrame(frame);
  }
  window.__stepShader=function(t){draw(t,sweepAt(t));};   // 导出 GIF/MP4 逐帧驱动（光带随之循环扫）
  window.__shaderRate=SPEED;                              // t 每真实秒推进量
  window.__shaderPeriod=HOLD+CYCLE;                       // 光带扫完一整轮的 u_time 跨度 —— GIF 导出据此录「正放无缝循环」，不用 boomerang 倒放
})();
}else{
var m=makeMesh(cv,3);
m.setColors(CFG.colors);
m.setParams({dist:CFG.dist,swirl:CFG.swirl,grain:CFG.grain,seed:CFG.seed});
var shaderTime=(CFG.time0!=null?CFG.time0:U_TIME),last=performance.now();
if(CFG.freeze!=null){
  m.draw(CFG.freeze);
  new ResizeObserver(function(){m.draw(CFG.freeze);}).observe(cv);
}else{
  var frame=function(now){var dt=Math.min(0.05,(now-last)/1000);last=now;shaderTime+=dt*0.9;
    m.draw(shaderTime);requestAnimationFrame(frame);};

window.__stepShader=function(t){m.draw(t);};   // 导出 GIF/MP4 时逐帧驱动
window.__shaderRate=0.9;                       // u_time 每真实秒推进量，导出端读它做速率对齐
}

<script>
// ===== 符号纹理层（design-gallery 实验五 · Texture Layer）=====
// 公式 = 底层渐变 × 图案平铺 × 软蒙版：图案本身是规则无限平铺的白色细线，
// 靠 overlay 借底色 —— 亮处清晰、暗处隐形；不规则感全部来自软蒙版：
// 2~4 团软椭圆交替落左右三分位、避开中心主体，各自错相位「呼吸」+ 绕基准点慢速漂移。
// CFG.tex=null 时整层不存在（默认）；CFG.tex='line' 开斜线。蒙版随机数吃 CFG.seed，静/动同画面。
if(CFG.tex){(function(){
  var PATTERNS={
    line:{pat:'repeating-linear-gradient(45deg, rgba(255,255,255,1) 0 1px, transparent 1px 8px)',size:'auto'},
    dots:{pat:'radial-gradient(circle at 50% 50%, rgba(255,255,255,1) 2px, transparent 2.8px)',size:'16px 16px'}
  };
  var p=PATTERNS[CFG.tex]||PATTERNS.line;
  var el=document.createElement('div');
  el.style.cssText='position:absolute;inset:0;pointer-events:none;background-image:'+p.pat+
    ';background-size:'+p.size+';mix-blend-mode:'+(CFG.texBlend||'overlay')+';opacity:'+(CFG.texOp!=null?CFG.texOp:1)+';';
  var wrap=document.getElementById('wrap');
  wrap.insertBefore(el,document.querySelector('.center'));   // 铺在 shader 之上、字标之下
  // 播种随机：同一 seed → 同一组蒙版，静态 PNG 与动态 HTML 不会跑出两套形态
  var s=(CFG.seed==null?42:CFG.seed)*9301+49297,rnd=function(a,b){s=(s*9301+49297)%233280;return a+(s/233280)*(b-a);};
  // 落位两种：默认 = 实验五原版（左右三分位交替、避开中心主体）；
  // texLayout='diag' = 对角线布局：各团串在左上→右下这条对角线上（与 45° 斜线同向），
  // 连成一条斜贯画面的纹理带，而不是散在两侧的孤岛。
  // 对角线上刻意排得不匀：团数多一点，沿线的间距按随机步长累积（有的挤成一簇、有的空一大段），
  // 再各自沿对角线的法向偏出去 ±14%，大小和浓度也拉开档次 —— 免得看着像等距贴上去的贴纸。
  var DIAG=(CFG.texLayout==='diag');
  var blobs=(function(){
    var n=DIAG?(4+Math.floor(rnd(0,3))):(2+Math.floor(rnd(0,3))),o=[],steps=[],sum=0,i;
    for(i=0;i<n;i++){var st=rnd(0.35,1.65);steps.push(st);sum+=st;}   // 步长忽长忽短 = 疏密不均
    var acc=0;
    for(i=0;i<n;i++){
      acc+=steps[i];
      var u=(acc-steps[i]*rnd(0.3,0.7))/sum;                          // 沿对角线的位置 0~1
      var off=rnd(-14,14);                                            // 法向偏移：+x −y 即垂直于对角线
      o.push({
        x:DIAG?(6+88*u+off):((i%2===0)?rnd(60,88):rnd(8,36)),
        y:DIAG?(6+88*u-off):rnd(18,82),
        rx:DIAG?rnd(14,46):rnd(22,40), ry:DIAG?rnd(20,66):rnd(34,58),
        a:DIAG?rnd(0.35,1):rnd(0.65,1),
        phA:i/n*6.283+rnd(-0.9,0.9), spA:rnd(0.07,0.18),              // 呼吸：周期 6~14s，相位错开
        dx:rnd(3,8), dy:rnd(3,8), phD:rnd(0,6.283), spD:rnd(0.04,0.09) // 漂移：幅度 3~8%、周期 11~25s
      });
    }
    return o;})();
  function paint(t){
    var m=blobs.map(function(b){
      var breathe=0.5+0.5*Math.sin(t*b.spA*6.283+b.phA);
      var x=b.x+b.dx*Math.sin(t*b.spD*6.283+b.phD), y=b.y+b.dy*Math.cos(t*b.spD*6.283+b.phD*1.3);
      var a=b.a*(0.08+0.92*breathe);
      return 'radial-gradient(ellipse '+b.rx.toFixed(0)+'% '+b.ry.toFixed(0)+'% at '+x.toFixed(0)+'% '+y.toFixed(0)+'%, rgba(0,0,0,'+a.toFixed(2)+') 0%, transparent 72%)';
    }).join(',');
    el.style.webkitMaskImage=m; el.style.maskImage=m;
  }
  if(CFG.freeze!=null){paint(CFG.freeze);}
  else{
    var st=(CFG.time0!=null?CFG.time0:0),last=performance.now();
    var frame=function(now){var dt=Math.min(0.05,(now-last)/1000);last=now;st+=dt*0.9;paint(st);requestAnimationFrame(frame);};
    paint(st);requestAnimationFrame(frame);
  }
  var prev=window.__stepShader;                       // GIF 导出：跟着 shader 一起逐帧推进
  window.__stepShader=function(t){prev&&prev(t);paint(t);};
})();}
</script>
<script>
// ===== FigGPU 液态定格（逐帧对齐 Figma generative shaders 博客里 Rogie 的 FigGPU 原型演示段）=====
// CFG.gpu={intensity,edge,speed}：磁块 + 字标视作一个组，循环播放参考视频逐帧标定出的四幕——
//   ① f01-45 鼓包从「中间」先起：中段字形被吹得巨大（参考视频里 g 膨成球），带 gooey 墨滴感
//   ② f45-60 鼓包向两端转移：中间字形回落恢复，两端字形接棒越吹越大到峰值
//   ③ f61-70 两端竖向压扁成横条流线，缩回单词
//   ④ f71-92 干净静置一拍，循环
// 实现 = gooey（feGaussianBlur + alpha 对比度 = 字形充气变圆）→ 中心鼓包场 → 横向端拉场
// → 纵向端部场（scale 正=吹大、负=压扁），三个 feDisplacementMap 串联，四条包络逐帧驱动。
// 位移场只烘一次；场在框外线性延伸（真放大场），clamp 恒定值会把字形平移出断裂鬼影。
// 只在动态预览生效（静态定格不吃它）。已知取舍：CSS filter 让 .group 成为 backdrop root，
// 磁块的 backdrop-filter 采样不到背景 → 效果开启期间玻璃暂失磨砂。
if(CFG.gpu&&!CFG.static){(function(){
  var P=CFG.gpu;
  var INT=P.intensity!=null?P.intensity:0.2;   // 强度：整体变形幅度 + 柔焦量
  var EDGE=P.edge!=null?P.edge:0.5;            // 边缘：两端受拉区各占组宽比例（0.15~2，>0.5 时受拉区互相重叠、全组卷入且端拉幅度继续放大）
  var SPEED=P.speed!=null?P.speed:2.6;        // 速度：默认 2.67 时活跃段 ≈ 参考视频的 1.5s
  var NS='http://www.w3.org/2000/svg';
  var sm=function(x){x=x<0?0:x>1?1:x;return x*x*(3-2*x);};   // smoothstep
  // 等 fitGroup 定稿再初始化：位移场按磁块+字标组的「实测画面位置」生成。
  // 滤镜落在 .center（全幅、正坐标）：Chrome 对 CSS filter 里负坐标 feImage 的摆放不可靠，
  // 图会错位、没盖住的区域按透明采样（=对角大位移），之前的断裂鬼影全来自这里。
  function init(){
    var group=document.querySelector('.group');
    var CW=window.innerWidth||1080, CH=window.innerHeight||460;
    var r=group.getBoundingClientRect();
    if(!r.width)return;
    var gx=r.left,gy=r.top,gwp=r.width,ghp=r.height;
    var zone=function(q){return q<=0?0:(q<=1?sm(q):1+(q-1)*0.9);}   // 区内 smoothstep，区外线性续拉
    var zcap=function(q){return q<=0?0:(q<=1?sm(q):1);}
    var MW=1024,MH=512;
    // 通用位移场烘焙：fields(u,v) 返回 [fx,fy]（组坐标系，u/v 组内 0~1），整场归一化，增益随 URL 一起返回
    function bake(fields){
      var m=1e-6,x,y,u,v,f;
      for(y=0;y<MH;y+=8)for(x=0;x<MW;x+=4){
        u=((x/MW)*CW-gx)/gwp; v=((y/MH)*CH-gy)/ghp;
        f=fields(u,v); m=Math.max(m,Math.abs(f[0]),Math.abs(f[1]));
      }
      var c=document.createElement('canvas');c.width=MW;c.height=MH;
      var ctx=c.getContext('2d'),img=ctx.createImageData(MW,MH),d=img.data;
      for(y=0;y<MH;y++){
        v=((y/MH)*CH-gy)/ghp;
        for(x=0;x<MW;x++){
          u=((x/MW)*CW-gx)/gwp;
          f=fields(u,v);
          var o=(y*MW+x)*4;
          d[o]=128+f[0]/m*118; d[o+1]=128+f[1]/m*118; d[o+2]=128; d[o+3]=255;
        }
      }
      ctx.putImageData(img,0,0);
      return {url:c.toDataURL(),gain:m};
    }
    // 中心鼓包场：中段高斯权重双向放大（参考视频第一幕「g 被吹成球」）
    var SIG=0.17;
    var gauss=function(u){var q=(u-0.5)/SIG;return Math.exp(-q*q/2);};
    var mapC=bake(function(u,v){return [(0.5-u)*gauss(u)*2.2,(0.5-v)*gauss(u)*0.85];});
    // 横向端拉场：中间零位移、两端 EDGE 区平滑增长把端部外扯放大
    var mapX=bake(function(u,v){return [zone((EDGE-u)/EDGE)-zone((u-(1-EDGE))/EDGE),0];});
    // 纵向端部场：两端竖向缩放（scale 正=吹大、负=压扁）
    var mapY=bake(function(u,v){
      var ef=Math.max(zcap((EDGE-u)/EDGE),zcap((u-(1-EDGE))/EDGE));
      return [0,Math.max(-1,Math.min(1,(0.5-v)*ef))];
    });
    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('width','0');svg.setAttribute('height','0');
    svg.style.cssText='position:absolute;width:0;height:0';
    var fe=function(res,url){return '<feImage href="'+url+'" x="0" y="0" width="'+CW+'" height="'+CH+'" preserveAspectRatio="none" result="'+res+'"/>';};
    svg.innerHTML='<filter id="gpufx" x="-0.05" y="-0.15" width="1.1" height="1.3" color-interpolation-filters="sRGB">'
      +'<feGaussianBlur id="gpuBlur" in="SourceGraphic" stdDeviation="0" result="goo"/>'
      +fe('mc',mapC.url)
      +'<feDisplacementMap id="gpuDC" in="goo" in2="mc" scale="0" xChannelSelector="R" yChannelSelector="G" result="dc"/>'
      +fe('mx',mapX.url)
      +'<feDisplacementMap id="gpuDX" in="dc" in2="mx" scale="0" xChannelSelector="R" yChannelSelector="G" result="dx"/>'
      +fe('my',mapY.url)
      +'<feDisplacementMap id="gpuDY" in="dx" in2="my" scale="0" xChannelSelector="R" yChannelSelector="G" result="dy"/>'
      +'<feGaussianBlur id="gpuBlur2" in="dy" stdDeviation="0"/>'
      +'</filter>';
    document.body.appendChild(svg);
    document.querySelector('.center').style.filter='url(#gpufx)';
    var eBlur=document.getElementById('gpuBlur'),eBlur2=document.getElementById('gpuBlur2'),
        eDC=document.getElementById('gpuDC'),eDX=document.getElementById('gpuDX'),eDY=document.getElementById('gpuDY');
    // —— 时间线包络（参考视频 93 帧逐帧标定，s = 活跃段进度 0~1）——
    function envC(s){                                       // 中心鼓包：先起，0.48 满格（g 吹成球），0.64 前排空
      if(s<0.48)return sm(s/0.48);
      if(s<0.64)return 1-sm((s-0.48)/0.16);
      return 0;
    }
    function envSX(s){                                      // 横向端拉：中段接棒 → 0.63 峰值 → 收敛
      if(s<0.42)return 0.12*sm(s/0.42);
      if(s<0.63){var q=(s-0.42)/0.21;return 0.12+0.88*q*q;}
      if(s<0.78)return 1-sm((s-0.63)/0.15);
      return 0;
    }
    function envSY(s){                                      // 纵向端部：接棒吹大 → 0.62 后猛翻负=压扁成流线 → 回零
      if(s<0.45)return 0.2*sm(s/0.45);
      if(s<0.62)return 0.2+0.6*sm((s-0.45)/0.17);
      if(s<0.71)return 0.8-1.8*sm((s-0.62)/0.09);
      if(s<0.85)return -1*(1-sm((s-0.71)/0.14));
      return 0;
    }
    // 一轮 = 活跃段(0~0.6) + 静置(0.6~1)；默认 SPEED 2.67 → 周期 2.6s，活跃段 1.56s ≈ 参考视频时长
    var CYCLE=2.6*2.67;
    function paint(t){
      var u=(t%CYCLE)/CYCLE,s=u/0.6;
      var cb=s<1?envC(s):0, sx=s<1?envSX(s):0, sy=s<1?envSY(s):0;
      var goo=Math.min(1,0.8*cb+0.55*Math.max(sx,Math.abs(sy)));   // 墨滴柔焦跟着当前变形能量走
      eBlur.setAttribute('stdDeviation',(INT*1.6*goo).toFixed(2));                          // 位移前：字形充气变圆
      eBlur2.setAttribute('stdDeviation',(INT*(0.9*goo+1.8*Math.max(0,-sy))).toFixed(2));   // 位移后：压扁期流线柔焦
      eDC.setAttribute('scale',(INT*470*cb*mapC.gain).toFixed(1));
      // 端拉幅度随 EDGE 联动（受拉区越宽、卷入材料越多 → 端头拉得越远）：
      // 0.35 处 =1 保持标定，0.15→0.75 倍、0.5→1.2 倍——否则 edge 只改参与范围，肉眼几乎看不出差别
      var ea=0.55+1.3*EDGE;
      eDX.setAttribute('scale',(INT*380*sx*mapX.gain*ea).toFixed(1));
      eDY.setAttribute('scale',(INT*260*sy*mapY.gain*ea).toFixed(1));
    }
    // gpu 用自己的时钟从活跃段起点开跑（不吃 time0）：调参后立刻看到熔化起步，不用干等静置段播完
    var st=0,last=performance.now();
    (function frame(now){
      var dt=Math.min(0.05,(now-last)/1000);last=now;st+=dt*SPEED;
      paint(st);requestAnimationFrame(frame);
    })(last);
    // GIF/MP4 导出：跟着 shader 一起逐帧推进。导出端按 __shaderRate 推进 t（背景时间），
    // gpu 相位要换算回真实秒（t/RATE*SPEED）才和动态 HTML 完全同速。循环衔接：gpu 一整轮
    // 挂到 __shaderPeriod 让导出端录正放无缝循环；但背景 mesh 是无周期漂移，一轮后回不到
    // 起点、首尾帧会跳——所以导出时背景走「乒乓」时间（前半正走、后半原速倒走，首尾同画面；
    // 氛围漂移无方向感，反向不可察觉），gpu 动效保持正放。warmband 自带周期时不接管（背景
    // 按它的周期录，gpu 轮次与其不整除，衔接以光带为准）。
    var RATE=window.__shaderRate||1;
    var prev=window.__stepShader;
    var ownLoop=(window.__shaderPeriod==null);
    var P=CYCLE*RATE/SPEED, t0e=null;
    window.__stepShader=function(t){
      if(t0e==null)t0e=t;
      var rel=t-t0e;
      if(ownLoop){
        var q=((rel%P)+P)%P;
        prev&&prev(t0e+(q<P/2?q:P-q));
      }else{prev&&prev(t);}
      paint(rel/RATE*SPEED);
    };
    if(ownLoop)window.__shaderPeriod=P;
  }
  // fitGroup 在 DOMContentLoaded 里定稿组的缩放，本层在它之后再量位置
  if(document.readyState!=='loading'){requestAnimationFrame(init);}
  else{document.addEventListener('DOMContentLoaded',function(){requestAnimationFrame(init);});}
})();}
</script>
<script>
// ===== 安全区自适应 + 磁块下限（2026-09-07 定稿：组宽基准 560 与全部已发布定稿一致，磁块触底 87px 才被动放宽组宽）=====
(function(){
  var SAFE_W=560, SAFE_H=380;
  var S_FLOOR=0.58, MAX_W=818; // S_FLOOR=87/150：磁块下限 87px（Codebase 档，量 4 张已发布定稿反推）；MAX_W=组宽硬顶（16:9 裁切区）
  function fitGroup(){
    var g=document.querySelector(".group"); if(!g) return;
    g.style.transform="none";
    var sx=(window.innerWidth||1080)/1080;
    var r=g.getBoundingClientRect();
    var nat=r.width/sx;
    var s=Math.min(1, SAFE_W/nat, SAFE_H/(r.height/sx));
    if(s<S_FLOOR){
      s=Math.min(S_FLOOR, MAX_W/nat);
      console.warn("GLASSHERO_FIT 长标题触磁块下限：scale "+s.toFixed(3)+"，磁块 "+(150*s).toFixed(0)+"px，组宽 "+(nat*s).toFixed(0)+(150*s<86.5?"px — 已破 87px 下限，请缩短 TITLE 或改 col 布局":"px"));
    }
    g.style.transform="scale("+s.toFixed(4)+")";
  }
  if(document.readyState!=="loading") fitGroup(); else document.addEventListener("DOMContentLoaded",fitGroup);
  window.addEventListener("resize",fitGroup);
  // 文字光擦（Event Cards）：CFG.lit 时给字标文字（svg.wm）套 radial mask，一团光把字擦出来（只吃 alpha 不动颜色）。
  // 落在 hero.html → 静态截图(PNG)和动态版一起生效；磁块不受影响。参数 {x,y,w,h}（画面 %），缺省 40/36/82/110。
  if(CFG.lit){
    var L=(typeof CFG.lit==='object'&&CFG.lit)?CFG.lit:{};
    var lx=L.x!=null?L.x:40, ly=L.y!=null?L.y:36, lw=L.w!=null?L.w:82, lh=L.h!=null?L.h:110;
    var lg='radial-gradient(ellipse '+lw+'% '+lh+'% at '+lx+'% '+ly+'%,#000 20%,rgba(0,0,0,.62) 50%,rgba(0,0,0,.2) 78%,transparent 100%)';
    var lst=document.createElement('style');
    lst.textContent='svg.wm{-webkit-mask-image:'+lg+';mask-image:'+lg+'}';
    document.head.appendChild(lst);
  }
  window.__ready=true;
})();
</script>
